name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thanglong_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d thanglong_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thanglong_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/thanglong_test
      AUTH_SECRET: ci-secret-with-at-least-32-characters-long
      CRON_SECRET: ci-cron-secret-with-at-least-32-characters
      LEAD_RATE_LIMIT_SECRET: ci-lead-rate-limit-secret-with-at-least-32-characters
      RUN_INTEGRATION: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma validate
      - run: npm run production:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
